<div id="qr-setup-area" class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 mb-6 max-w-4xl mx-auto">
    <div class="text-center mb-8">
        <i class="fa-solid fa-chalkboard-user text-5xl text-candy-darkPink mb-3"></i>
        <h3 class="text-2xl font-bold text-gray-800">โหมดฉายโปรเจคเตอร์</h3>
        <p class="text-gray-500 mt-2">กำหนดค่าและเริ่มฉาย QR Code ให้นักศึกษาสแกน</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">1. เลือกวิชา</label>
            <select id="session-course-select" class="w-full p-3.5 rounded-xl border border-gray-200 shadow-sm focus:ring-candy-pink focus:border-candy-darkPink outline-none bg-gray-50 transition-colors"></select>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">2. ครั้งที่เช็คชื่อ</label>
            <input type="number" id="session-no-input" min="1" class="w-full p-3.5 rounded-xl border border-gray-200 shadow-sm focus:ring-candy-pink focus:border-candy-darkPink outline-none text-center font-bold bg-gray-50 transition-colors">
            <div id="session-no-hint" class="mt-2 text-xs text-gray-500">กรุณาเลือกวิชาก่อน</div>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">3. เวลาสาย (น.)</label>
            <input type="time" id="session-late-time" value="08:30" class="w-full p-3.5 rounded-xl border border-gray-200 shadow-sm focus:ring-candy-pink focus:border-candy-darkPink outline-none text-center font-bold bg-gray-50 transition-colors">
            <div class="mt-2 text-xs text-gray-500">เช็คชื่อหลังเวลานี้ถือว่ามาสาย</div>
        </div>
    </div>
    
    <button onclick="startProjectorSession()" class="w-full bg-candy-darkPink hover:bg-pink-600 text-white px-6 py-4 rounded-xl shadow-lg font-bold text-lg transition-transform active:scale-95 flex items-center justify-center gap-3">
        <i class="fa-solid fa-play text-xl"></i> เริ่มฉาย QR Code
    </button>
</div>

<!-- Projector Fullscreen Overlay Area -->
<div id="projector-overlay" class="hidden-view fixed inset-0 bg-white z-[100] flex flex-col">
    <div class="p-6 flex justify-between items-center bg-gray-50 border-b shadow-sm">
        <div>
            <h2 class="text-3xl font-black text-gray-800 tracking-tight" id="proj-course-name">วิชา...</h2>
            <p class="text-lg text-candy-textPink font-bold mt-1" id="proj-session-info">ครั้งที่ 1</p>
        </div>
        <div class="text-right">
            <div class="text-4xl font-bold text-gray-700 font-mono" id="proj-time">00:00:00</div>
            <button onclick="stopProjectorSession()" class="mt-3 bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-md transition-transform active:scale-95">
                <i class="fa-solid fa-stop mr-1"></i> ปิดระบบ
            </button>
        </div>
    </div>
    
    <div class="flex-1 flex flex-col md:flex-row p-8 gap-8 bg-gray-100/50">
        <!-- QR Left -->
        <div class="flex-1 flex flex-col items-center justify-center">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl border-4 border-candy-pink relative flex flex-col items-center">
                <h3 class="text-2xl font-bold text-candy-textPurple mb-6 uppercase tracking-wider">สแกนเพื่อเช็คชื่อ</h3>
                <div id="proj-qr-container" class="bg-white p-2 border rounded-xl"></div>
                
                <!-- Timer Bar -->
                <div class="w-full max-w-[400px] mt-8">
                    <div class="flex justify-between text-sm font-bold text-gray-500 mb-2">
                        <span>กำลังรีเฟรชรหัส...</span>
                        <span id="proj-timer-text">60 วิ</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                        <div id="proj-timer-bar" class="bg-candy-darkPink h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Realtime List Right -->
        <div class="w-full md:w-1/3 bg-white rounded-3xl shadow-xl border border-gray-200 flex flex-col overflow-hidden">
            <div class="p-6 bg-candy-blue/30 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-users mr-2"></i> ผู้เข้าเรียน</h3>
                <span class="bg-white px-3 py-1 rounded-full text-sm font-bold text-blue-700 shadow-sm"><span id="proj-live-count">0</span> คน</span>
            </div>
            <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <ul id="proj-live-list" class="space-y-3">
                    <li class="text-center text-gray-400 py-10">ยังไม่มีผู้ลงชื่อ...</li>
                </ul>
            </div>
        </div>
    </div>
</div>
