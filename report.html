<div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-end">
    <div class="flex-1 w-full">
        <label class="block text-sm font-bold text-gray-700 mb-2">กรองตามรายวิชา</label>
        <select id="report-course-filter" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none">
            <option value="ALL">-- ทุกรายวิชา --</option>
        </select>
    </div>
    <div class="flex-1 w-full">
        <label class="block text-sm font-bold text-gray-700 mb-2">กรองตามครั้งที่เช็คชื่อ</label>
        <select id="report-session-filter" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 outline-none">
            <option value="ALL">-- ทุกครั้ง (เลือกวิชาก่อน) --</option>
        </select>
    </div>
    <div class="flex gap-2 w-full md:w-auto">
        <button onclick="exportExcel()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-xl shadow font-bold transition-transform active:scale-95 flex justify-center items-center">
            <i class="fa-solid fa-file-excel mr-2"></i> Excel
        </button>
        <button onclick="exportPDF()" class="flex-1 bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-xl shadow font-bold transition-transform active:scale-95 flex justify-center items-center">
            <i class="fa-solid fa-file-pdf mr-2"></i> PDF
        </button>
    </div>
</div>

<div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden" id="report-table-area">
    <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-list-ol mr-2 text-candy-textPurple"></i> ตารางสรุปข้อมูล</h3>
        <span class="text-sm text-gray-500" id="report-count-text">พบ 0 รายการ</span>
    </div>
    <div class="overflow-x-auto p-4">
        <table class="w-full text-left whitespace-nowrap text-sm">
            <thead>
                <tr class="bg-gray-100/50 text-gray-700 border-b">
                    <th class="p-3">วันที่/เวลา</th>
                    <th class="p-3">ครั้งที่</th>
                    <th class="p-3">วิชา</th>
                    <th class="p-3">รหัสนักศึกษา</th>
                    <th class="p-3">ชื่อ-นามสกุล</th>
                    <th class="p-3">ระยะทาง</th>
                    <th class="p-3 text-center">สถานะ</th>
                </tr>
            </thead>
            <tbody id="report-table-body" class="divide-y divide-gray-50">
                <!-- Generated by JS -->
            </tbody>
        </table>
    </div>
</div>
