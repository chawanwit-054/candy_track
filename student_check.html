<div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row gap-4 items-end">
    <div class="flex-1 w-full">
        <label class="block text-sm font-bold text-candy-textPurple mb-2">1. เลือกวิชา</label>
        <select id="rollcall-course-select" class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:ring-candy-purple focus:border-candy-textPurple outline-none transition-colors"></select>
    </div>
    <div class="w-full md:w-48">
        <label class="block text-sm font-bold text-candy-textPurple mb-2">2. ครั้งที่เช็คชื่อ</label>
        <input type="number" id="rollcall-session-no" min="1" value="1" class="w-full p-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:ring-candy-purple focus:border-candy-textPurple outline-none text-center font-bold transition-colors">
    </div>
    <button onclick="fetchRollCallList()" class="bg-candy-textPurple hover:bg-purple-800 text-white px-6 py-3.5 rounded-xl shadow-md font-bold transition-transform active:scale-95 w-full md:w-auto whitespace-nowrap">
        <i class="fa-solid fa-list-check mr-2"></i> ดึงรายชื่อ
    </button>
</div>

<div id="rollcall-session-hint" class="hidden text-sm mb-6 px-4 py-3 rounded-xl border shadow-sm block"></div>

<div id="rollcall-table-container" class="hidden bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
    <div class="p-5 bg-gray-50 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-users mr-2 text-candy-textPink"></i> รายชื่อนักศึกษา</h3>
        <button onclick="markAllRollCallPresent()" class="bg-green-100 hover:bg-green-200 text-green-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-sm">
            <i class="fa-solid fa-check-double mr-1"></i> เช็ค "มาเรียน" ทุกคน
        </button>
    </div>
    <div class="overflow-x-auto p-4">
        <table class="w-full text-left whitespace-nowrap">
            <thead>
                <tr class="text-gray-500 bg-gray-100/50 border-b text-sm">
                    <th class="p-3 text-center w-12 rounded-tl-lg">ลำดับ</th>
                    <th class="p-3">รหัสนักศึกษา</th>
                    <th class="p-3">ชื่อ-นามสกุล</th>
                    <th class="p-3 rounded-tr-lg">สถานะการเข้าเรียน</th>
                </tr>
            </thead>
            <tbody id="rollcall-table-body" class="divide-y divide-gray-50 text-sm">
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>
    <div class="p-5 bg-gray-50 border-t border-gray-200 flex justify-end">
        <button onclick="saveManualAttendance()" class="bg-candy-darkPink hover:bg-pink-600 text-white px-8 py-3.5 rounded-xl shadow-lg font-bold text-lg transition-transform active:scale-95">
            <i class="fa-solid fa-floppy-disk mr-2"></i> บันทึกผลการเช็คชื่อ
        </button>
    </div>
</div>
